[package]
name = "slider-engine"
version = "0.1.0"
edition = "2021"
description = "Rust port of the Slider 2v2 search engine, self-play generator and weight benchmark"
publish = false

[lib]
name = "slider"
path = "src/lib.rs"

[[bin]]
name = "selfplay"
path = "src/bin/selfplay.rs"

[[bin]]
name = "trainnet"
path = "src/bin/trainnet.rs"

[[bin]]
name = "trainloop"
path = "src/bin/trainloop.rs"

[[bin]]
name = "bestmove"
path = "src/bin/bestmove.rs"

[[bin]]
name = "play"
path = "src/bin/play.rs"

[[bin]]
name = "spsa"
path = "src/bin/spsa.rs"

[[bin]]
name = "matchup"
path = "src/bin/matchup.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
